{% extends "base.html" %}
{% block title %}Editar {{ object.nombre }}{% endblock %}
{% block nav_proveedores %}active{% endblock %}

{% block content %}
<div class="erp-card">
    <div class="erp-card-header">Editar proveedor</div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Guardar cambios</button>
        <a class="btn btn-link" href="{% url 'proveedores:detalle' object.pk %}">Cancelar</a>
    </form>
</div>
{% endblock %}
