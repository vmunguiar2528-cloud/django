{% extends "base.html" %}
{% block title %}Nuevo proveedor{% endblock %}
{% block nav_proveedores %}active{% endblock %}

{% block content %}
<div class="erp-card">
    <div class="erp-card-header">Registrar proveedor</div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Guardar proveedor</button>
        <a class="btn btn-link" href="{% url 'proveedores:lista' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
