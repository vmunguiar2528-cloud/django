{% extends "base.html" %}
{% block title %}Inicio{% endblock %}

{% block content %}
<div class="text-center py-4" style="padding-top:1rem!important;">
    <div style="display:inline-block;padding:.7rem 1.4rem;border-radius:999px;background:linear-gradient(135deg,#facc15,#fbbf24);border:3px solid #1d4ed8;box-shadow:0 8px 18px rgba(29,78,216,.2);margin-bottom:1rem;">
        <span style="font-size:1.3rem;">⚡</span>
    </div>
    <h1 style="font-family:'Playfair Display',serif;
               color:#1d4ed8;font-size:2.4rem;font-weight:800;
               text-transform:uppercase;letter-spacing:.08em;">
        Puchamones
    </h1>
    <p style="color:#1d4ed8;font-size:1.08rem;font-weight:600;letter-spacing:.04em;">
        Wattpad · Pitochu · Pendertuga · Gordax
    </p>
    <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
        <span class="badge-erp-gold">Inventario</span>
        <span class="badge-erp-gold">Ventas</span>
        <span class="badge-erp-gold">Reportes</span>
    </div>
</div>

<div class="row g-3 mt-2">
    {% for m in modulos %}
    <div class="col-md-4">
        <div class="erp-card text-center"
             style="cursor:pointer; border:2px solid rgba(29,78,216,.18); background:#f8fbff;" onclick="window.location='{{ m.url }}'">
            <div style="font-size:2rem;margin-bottom:.4rem;">{{ m.icono }}</div>
            <strong style="color:#1d4ed8; font-size:1.08rem;">{{ m.nombre }}</strong>
            <p style="color:#1d4ed8;font-size:.86rem;margin:.45rem 0 0;">
                {{ m.descripcion }}
            </p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
