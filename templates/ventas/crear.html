{% extends "base.html" %}
{% block title %}Registrar venta{% endblock %}
{% block nav_ventas %}active{% endblock %}

{% block content %}
<div class="erp-card">
    <div class="erp-card-header">Registrar una venta</div>
    <form method="post">
        {% csrf_token %}
        <h2 class="h5">Datos del cliente</h2>
        {{ venta_form.as_p }}
        <h2 class="h5 mt-4">Producto vendido</h2>
        {{ detalle_form.as_p }}
        <button class="btn btn-primary" type="submit">Guardar venta</button>
        <a class="btn btn-link" href="{% url 'ventas:lista' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
