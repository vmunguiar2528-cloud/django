{% extends "base.html" %}
{% block title %}Eliminar {{ object.nombre }}{% endblock %}
{% block nav_productos %}active{% endblock %}

{% block content %}
<div class="erp-card">
    <div class="erp-card-header">Eliminar producto</div>
    <h1 class="h3">¿Eliminar “{{ object.nombre }}”?</h1>
    <p>Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
        <a class="btn btn-link" href="{% url 'productos:detalle' object.pk %}">Cancelar</a>
    </form>
</div>
{% endblock %}
